<!doctype html><n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243a"><title>Atharv Enterprises</title>
<style>
:root{--navy:#10243a;--blue:#1d5d86;--bg:#f3f6f9;--card:#fff;--muted:#64748b;--line:#dbe3eb}*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial;background:var(--bg);color:#172536}.top{background:var(--navy);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:2}.top h1{margin:0;font-size:21px}.top small{opacity:.8}.wrap{max-width:1000px;margin:auto;padding:14px}.tabs{display:flex;gap:7px;overflow:auto;padding:8px 0}.tabs button,.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:white;font-weight:600;white-space:nowrap}.tabs button{background:#dce7ef;color:var(--navy)}.tabs button.active{background:var(--navy);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #10243a0b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{font-size:23px;font-weight:750;color:var(--navy)}label{display:block;font-size:13px;color:var(--muted);margin:9px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:white}textarea{min-height:70px}form .btn{margin-top:12px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.item{padding:10px 0;border-bottom:1px solid var(--line)}.muted{color:var(--muted);font-size:13px}.danger{background:#a83232}.light{background:#e5edf4;color:var(--navy)}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;background:#e7f0f6;border-radius:20px;padding:4px 9px;font-size:12px}.empty{padding:22px;text-align:center;color:var(--muted)}@media(min-width:700px){.wrap{padding:22px}}
</style></head><body>
<header class="top"><h1>ATHARV ENTERPRISES</h1><small>Offline Contractor & Project Management</small></header><main class="wrap"><div class="tabs" id="tabs"></div><section id="view"></section></main>
<script>
const KEY='atharv_enterprises_v1';let db=load(),tab='Dashboard';function load(){
  const empty={projects:[],expenses:[],payments:[],materials:[],machines:[]};
  try{
    const stored=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!stored||typeof stored!=='object')return empty;
    return {projects:Array.isArray(stored.projects)?stored.projects:[],expenses:Array.isArray(stored.expenses)?stored.expenses:[],payments:Array.isArray(stored.payments)?stored.payments:[],materials:Array.isArray(stored.materials)?stored.materials:[],machines:Array.isArray(stored.machines)?stored.machines:[]};
  }catch(e){return empty}
}function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));return true}
  catch(e){alert('Data could not be saved on this device. Export a backup and check available storage.');return false}
}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function money(n){return '₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const tabs=['Dashboard','Projects','Expenses','Payments','Materials','Machinery','Reports','Backup'];
function render(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');let v=document.getElementById('view');({Dashboard:dashboard,Projects:projects,Expenses:expenses,Payments:payments,Materials:materials,Machinery:machinery,Reports:reports,Backup:backup}[tab]||dashboard)(v)}
function projectOpts(){return '<option value="">Select project</option>'+db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
function projectName(pid){return db.projects.find(p=>p.id===pid)?.name||'Unassigned'}
function dashboard(v){let total=db.expenses.reduce((a,x)=>a+ +x.amount,0),received=db.payments.filter(x=>x.type==='Received').reduce((a,x)=>a+ +x.amount,0),pending=db.payments.filter(x=>x.type==='Pending').reduce((a,x)=>a+ +x.amount,0);v.innerHTML=`<div class="grid"><div class="card"><div class="muted">Active Projects</div><div class="stat">${db.projects.length}</div></div><div class="card"><div class="muted">Total Expenses</div><div class="stat">${money(total)}</div></div><div class="card"><div class="muted">Payments Received</div><div class="stat">${money(received)}</div></div><div class="card"><div class="muted">Pending Payments</div><div class="stat">${money(pending)}</div></div></div><div class="card"><h3>Project Overview</h3>${db.projects.length?db.projects.map(p=>`<div class="item"><b>${esc(p.name)}</b> <span class="pill">${esc(p.status)}</span><div class="muted">${esc(p.location||'No location')} · Expenses ${money(db.expenses.filter(x=>x.project===p.id).reduce((a,x)=>a+ +x.amount,0))}</div></div>`).join(''):'<div class="empty">No projects yet. Add your first project.</div>'}</div><div class="card"><b>Offline mode</b><p class="muted">Your records are saved on this device. Export a JSON backup regularly, especially before changing or resetting your phone.</p></div>`}
function projects(v){v.innerHTML=`<div class="card"><h3>Add Project</h3><form onsubmit="addProject(event)"><div class="row"><div><label>Project Name *</label><input name="name" required placeholder="Road construction - Site 1"></div><div><label>Client / Department</label><input name="client"></div><div><label>Location</label><input name="location"></div><div><label>Contract Amount (₹)</label><input name="amount" type="number" min="0" step="0.01"></div><div><label>Start Date</label><input name="date" type="date"></div><div><label>Status</label><select name="status"><option>Active</option><option>On Hold</option><option>Completed</option></select></div></div><label>Scope / Notes</label><textarea name="notes"></textarea><button class="btn">Save Project</button></form></div><div class="card"><h3>All Projects</h3>${db.projects.length?db.projects.map(p=>`<div class="item"><b>${esc(p.name)}</b> <span class="pill">${esc(p.status)}</span><div class="muted">${esc(p.client)} · ${esc(p.location)} · Contract ${money(p.amount)}</div><div class="actions"><button class="btn light" onclick="projectSummary('${p.id}')">View Summary</button><button class="btn danger" type="button" data-delete-project="${esc(p.id)}">Delete Project</button></div></div>`).join(''):'<div class="empty">No projects created.</div>'}</div>`}
function addProject(e){e.preventDefault();let f=new FormData(e.target);db.projects.push({id:id(),name:f.get('name'),client:f.get('client'),location:f.get('location'),amount:+f.get('amount')||0,date:f.get('date'),status:f.get('status'),notes:f.get('notes')});save();render()}
function delProject(pid){
  if(!confirm('Delete this project and all its linked entries?'))return;
  db.projects=db.projects.filter(p=>String(p.id)!==String(pid));
  ['expenses','payments','materials','machines'].forEach(k=>db[k]=db[k].filter(x=>String(x.project)!==String(pid)));
  save();render();
}
document.addEventListener('click',function(event){
  const button=event.target.closest('[data-delete-project]');
  if(!button)return;
  delProject(button.getAttribute('data-delete-project'));
});
function projectSummary(pid){let p=db.projects.find(x=>x.id===pid);alert(`${p.name}\nContract: ${money(p.amount)}\nExpenses: ${money(db.expenses.filter(x=>x.project===pid).reduce((a,x)=>a+ +x.amount,0))}\nReceived: ${money(db.payments.filter(x=>x.project===pid&&x.type==='Received').reduce((a,x)=>a+ +x.amount,0))}`)}
function expenses(v){v.innerHTML=`<div class="card"><h3>Record Expense</h3><form onsubmit="addEntry(event,'expenses')"><div class="row"><div><label>Project *</label><select name="project" required>${projectOpts()}</select></div><div><label>Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Category</label><select name="category"><option>Labour</option><option>Diesel / Fuel</option><option>Machinery</option><option>Transport</option><option>Material</option><option>Food / Site</option><option>Other</option></select></div><div><label>Amount (₹) *</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Paid To / Vendor</label><input name="party"></div></div><label>Description</label><input name="description"><button class="btn">Save Expense</button></form></div>${listCard('Expenses',db.expenses,x=>`${esc(x.date)} · ${esc(projectName(x.project))} · ${esc(x.category)} · ${money(x.amount)} · ${esc(x.party)}`)}`}
function payments(v){v.innerHTML=`<div class="card"><h3>Payment Entry</h3><form onsubmit="addEntry(event,'payments')"><div class="row"><div><label>Project *</label><select name="project" required>${projectOpts()}</select></div><div><label>Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Type</label><select name="type"><option>Received</option><option>Pending</option><option>Advance Paid</option></select></div><div><label>Amount (₹) *</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Reference / Party</label><input name="party"></div></div><label>Notes</label><input name="description"><button class="btn">Save Payment</button></form></div>${listCard('Payments',db.payments,x=>`${esc(x.date)} · ${esc(projectName(x.project))} · ${esc(x.type)} · ${money(x.amount)} · ${esc(x.party)}`)}`}
function addEntry(e,key){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f.entries());o.id=id();o.amount=+o.amount;db[key].push(o);save();render()}
function listCard(title,arr,fn){return `<div class="card"><h3>Recent ${title}</h3>${arr.length?arr.slice().reverse().map(x=>`<div class="item">${fn(x)} <button class="btn danger" style="float:right;padding:5px 9px" type="button" data-delete-key="${title==='Expenses'?'expenses':'payments'}" data-delete-id="${esc(x.id)}">Delete</button></div>`).join(''):'<div class="empty">No entries yet.</div>'}</div>`}
function removeEntry(k,i){
  const allowed=['expenses','payments','materials','machines'];
  if(!allowed.includes(k)){alert('This record type cannot be deleted here.');return}
  const before=db[k].length;
  db[k]=db[k].filter(x=>String(x.id)!==String(i));
  if(db[k].length===before){alert('Record not found. Please refresh the app and try again.');return}
  save();render();
}
document.addEventListener('click',function(event){
  const button=event.target.closest('[data-delete-key][data-delete-id]');
  if(!button)return;
  const key=button.getAttribute('data-delete-key');
  const recordId=button.getAttribute('data-delete-id');
  if(!confirm('Are you sure you want to permanently delete this record?'))return;
  removeEntry(key,recordId);
});
function materials(v){v.innerHTML=`<div class="card"><h3>Material Purchase / Stock</h3><form onsubmit="materialAdd(event)"><div class="row"><div><label>Project *</label><select name="project" required>${projectOpts()}</select></div><div><label>Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Material *</label><input name="name" required placeholder="Grit / Sand / Bitumen"></div><div><label>Quantity *</label><input name="qty" type="number" step="0.01" min="0.01" required></div><div><label>Unit</label><select name="unit"><option>MT</option><option>Cu.M</option><option>Bag</option><option>Litre</option><option>Piece</option><option>Trip</option></select></div><div><label>Total Cost (₹)</label><input name="cost" type="number" min="0" step="0.01"></div></div><label>Supplier / Notes</label><input name="notes"><button class="btn">Add Material Record</button></form></div><div class="card"><h3>Material Records</h3>${db.materials.length?db.materials.slice().reverse().map(x=>`<div class="item"><b>${esc(x.name)}</b> · ${esc(projectName(x.project))}<div class="muted">${esc(x.date)} · ${x.qty} ${esc(x.unit)} · ${money(x.cost)} · ${esc(x.notes)}</div><div class="actions"><button class="btn danger" type="button" data-delete-key="materials" data-delete-id="${esc(x.id)}">Delete</button></div></div>`).join(''):'<div class="empty">No material records.</div>'}</div><p class="muted">This first version records purchases/quantities. Consumption and inter-project transfer will be added in the next build.</p>`}
function materialAdd(e){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f.entries());o.id=id();o.qty=+o.qty;o.cost=+o.cost||0;db.materials.push(o);save();render()}
function machinery(v){v.innerHTML=`<div class="card"><h3>Machinery / Equipment Log</h3><form onsubmit="machineAdd(event)"><div class="row"><div><label>Project *</label><select name="project" required>${projectOpts()}</select></div><div><label>Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Machine Name *</label><input name="name" required placeholder="JCB / Roller / Dumper"></div><div><label>Hours Used</label><input name="hours" type="number" min="0" step="0.5"></div><div><label>Cost (₹)</label><input name="cost" type="number" min="0" step="0.01"></div><div><label>Maintenance / Notes</label><input name="notes"></div></div><button class="btn">Save Machine Log</button></form></div><div class="card"><h3>Machine Logs</h3>${db.machines.length?db.machines.slice().reverse().map(x=>`<div class="item"><b>${esc(x.name)}</b> · ${esc(projectName(x.project))}<div class="muted">${esc(x.date)} · ${x.hours||0} hours · ${money(x.cost)} · ${esc(x.notes)}</div><div class="actions"><button class="btn danger" type="button" data-delete-key="machines" data-delete-id="${esc(x.id)}">Delete</button></div></div>`).join(''):'<div class="empty">No machinery records.</div>'}</div>`}
function machineAdd(e){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f.entries());o.id=id();o.hours=+o.hours||0;o.cost=+o.cost||0;db.machines.push(o);save();render()}
function reports(v){let rows=db.projects.map(p=>{let ex=db.expenses.filter(x=>x.project===p.id).reduce((a,x)=>a+ +x.amount,0),rec=db.payments.filter(x=>x.project===p.id&&x.type==='Received').reduce((a,x)=>a+ +x.amount,0),pend=db.payments.filter(x=>x.project===p.id&&x.type==='Pending').reduce((a,x)=>a+ +x.amount,0);return{p,ex,rec,pend,bal:rec-ex}});v.innerHTML=`<div class="card"><h3>Project-wise Financial Summary</h3>${rows.length?`<div style="overflow:auto"><table width="100%" cellspacing="0" cellpadding="8"><tr><th align="left">Project</th><th>Contract</th><th>Expense</th><th>Received</th><th>Pending</th><th>Cash Balance</th></tr>${rows.map(r=>`<tr><td>${esc(r.p.name)}</td><td>${money(r.p.amount)}</td><td>${money(r.ex)}</td><td>${money(r.rec)}</td><td>${money(r.pend)}</td><td>${money(r.bal)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Create a project to see reports.</div>'}<div class="actions"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn light" onclick="exportCSV()">Export Excel-compatible CSV</button></div><p class="muted">Cash Balance = received payments minus recorded expenses; it is not a certified accounting profit figure.</p></div>`}
function backup(v){v.innerHTML=`<div class="card"><h3>Data Backup & Restore</h3><p>All data is stored locally in this browser on this device. Keep regular backups in a separate safe location.</p><div class="actions"><button class="btn" onclick="exportJSON()">Download Full JSON Backup</button><label class="btn light" style="display:inline-block;cursor:pointer">Restore JSON Backup<input type="file" accept="application/json,.json" hidden onchange="restoreJSON(event)"></label><button class="btn light" onclick="exportCSV()">Export CSV</button></div><hr><h3>Data totals</h3><p>Projects: ${db.projects.length} · Expenses: ${db.expenses.length} · Payments: ${db.payments.length} · Materials: ${db.materials.length} · Machine logs: ${db.machines.length}</p><button class="btn danger" onclick="resetAll()">Delete All App Data</button></div><div class="card"><b>Important</b><p class="muted">Restore replaces the current app data. Export a backup first. Do not clear browser storage or uninstall the app before backing up.</p></div>`}
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportJSON(){download('Atharv_Enterprises_Backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'Atharv Enterprises',version:1,exportedAt:new Date().toISOString(),data:db},null,2),'application/json')}
function restoreJSON(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!d.projects||!d.expenses||!d.payments)throw Error('Invalid backup');if(confirm('Replace all current records with this backup?')){db={projects:d.projects||[],expenses:d.expenses||[],payments:d.payments||[],materials:d.materials||[],machines:d.machines||[]};save();render();alert('Backup restored successfully.')}}catch(err){alert('Could not restore: '+err.message)}};r.readAsText(file)}
function exportCSV(){let all=[['Record Type','Date','Project','Category/Type','Name/Party','Quantity/Hours','Unit','Amount','Notes']];for(let x of db.expenses)all.push(['Expense',x.date,projectName(x.project),x.category,x.party,'','',x.amount,x.description]);for(let x of db.payments)all.push(['Payment',x.date,projectName(x.project),x.type,x.party,'','',x.amount,x.description]);for(let x of db.materials)all.push(['Material',x.date,projectName(x.project),'Purchase',x.name,x.qty,x.unit,x.cost,x.notes]);for(let x of db.machines)all.push(['Machinery',x.date,projectName(x.project),'Usage',x.name,x.hours,'Hours',x.cost,x.notes]);let csv=all.map(row=>row.map(z=>'"'+String(z??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('Atharv_Enterprises_Records.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
function resetAll(){if(confirm('Permanently delete all local app records? Export backup first.')){db={projects:[],expenses:[],payments:[],materials:[],machines:[]};save();render()}}
render();
</script></body></html>
