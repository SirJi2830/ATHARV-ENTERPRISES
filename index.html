<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101318"><title>Atharv Enterprises</title>
<style>
:root{--bg:#f4f5f7;--ink:#171a20;--muted:#69717d;--gold:#d69b22;--gold2:#f3c65b;--dark:#101318;--card:#fff;--line:#e4e7eb;--green:#16794b;--red:#b53b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,Arial,sans-serif}.hero{background:radial-gradient(circle at 85% 0,#34302a 0,#171a20 42%,#0e1116 100%);color:#fff;padding:18px 16px 16px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;max-width:1100px;margin:auto}.brand img{width:58px;height:58px;object-fit:cover;border-radius:12px;border:1px solid #d6a83e}.brand h1{font-size:19px;letter-spacing:1.4px;margin:0}.brand small{color:#e9c46a}.wrap{max-width:1100px;margin:auto;padding:12px 14px 40px}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0 13px;scrollbar-width:thin}.tabs button,.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--dark);color:#fff;font-weight:650;white-space:nowrap;cursor:pointer}.tabs button{background:#e5e7eb;color:#343943}.tabs button.active{background:var(--dark);color:var(--gold2);box-shadow:inset 0 -3px var(--gold)}.btn.gold{background:linear-gradient(120deg,#bd8214,#edbd4e);color:#171717}.btn.light{background:#eceff2;color:#252a31}.btn.danger{background:#a83232}.btn.small{padding:6px 9px;font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 4px 16px #11182708}.card h3{margin:0 0 12px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{font-size:22px;font-weight:800;margin-top:3px}.muted{color:var(--muted);font-size:12px}.goldtext{color:#9a6a0c}.pill{display:inline-block;background:#fff4d8;color:#7b570c;border-radius:30px;padding:3px 9px;font-size:11px;font-weight:700}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d4d9df;border-radius:9px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:65px}form .btn{margin-top:12px}.item{padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{padding:20px;text-align:center;color:var(--muted)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:580px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:12px}th{background:#f6f7f8}.note{background:#fff8e8;border-left:3px solid var(--gold);padding:10px;border-radius:7px;color:#705316;font-size:12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.sectionhead h3{margin:0}@media(min-width:760px){.wrap{padding:18px 22px 50px}.brand img{width:66px;height:66px}}@media print{.hero,.tabs,.actions,form{display:none!important}.wrap{max-width:none}.card{box-shadow:none;break-inside:avoid}}
</style></head><body>
<header class="hero"><div class="brand"><img src="assets/atharv-logo.png" alt="Atharv Enterprises logo"><div><h1>ATHARV ENTERPRISES</h1><small>BUILDING YOUR TOMORROW · Contractor Management</small></div></div></header>
<main class="wrap"><div class="tabs" id="tabs"></div><section id="view"></section></main>
<script>
const KEY='atharv_enterprises_v2';const today=()=>new Date().toISOString().slice(0,10);let db=load(),tab='Dashboard';
function blank(){return{projects:[],expenses:[],payments:[],materials:[],machines:[],mb:[],dpr:[],attendance:[],consumption:[],evidence:[],documents:[]}}
function load(){try{let old=JSON.parse(localStorage.getItem(KEY)||'null');if(old)return {...blank(),...old};let v1=JSON.parse(localStorage.getItem('atharv_enterprises_v1')||'null');return v1?{...blank(),...v1}:blank()}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function money(n){return '₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function seed(){if(!db.projects.some(p=>p.tenderId==='2026_CEMRZ_1165596_1')){db.projects.push({id:'pwd-bhadohi-first-2026',name:'Bitumen Renewal – Shukulpur Road to Bhikharirampur PMGSY Road',client:'UP PWD – Provincial Division, Bhadohi',location:'Bhadohi, Uttar Pradesh',amount:438961.25,date:'',status:'LOA Pending',contractNo:'1922/24A',tenderId:'2026_CEMRZ_1165596_1',workId:'250121',lengthM:500,widthM:3.75,areaSqm:1875,discountPercent:15,estimatedAmount:516425,amountIncludesGST:true,boq:[{item:'WBM Grading-III',qty:14.5,unit:'CUM',amount:42050},{item:'Tack Coat VG-10',qty:1875,unit:'SQM',amount:24375},{item:'20mm Open Graded Premix Carpet',qty:1875,unit:'SQM',amount:328125},{item:'Seal Coat Type-C',qty:1875,unit:'SQM',amount:121875}]});save()}}seed();
const tabs=['Dashboard','Projects','Measurement Book','Daily Progress','Labour Attendance','Materials','Consumption','Expenses','Payments','Machinery','Reports','Site Evidence','Payment Calculator','Document Vault','Backup'];
function opts(){return '<option value="">Select project</option>'+db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}function pname(pid){return db.projects.find(p=>p.id===pid)?.name||'Unassigned'}
function render(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');({Dashboard:dashboard,Projects:projects,'Measurement Book':measurement,'Daily Progress':progress,'Labour Attendance':attendance,Materials:materials,Consumption:consumption,Expenses:expenses,Payments:payments,Machinery:machinery,Reports:reports,'Site Evidence':siteEvidence,'Payment Calculator':paymentCalculator,'Document Vault':documentVault,Backup:backup}[tab]||dashboard)(document.getElementById('view'))}
function dashboard(v){let ex=sum(db.expenses),rec=sum(db.payments.filter(x=>x.type==='Received')),lab=db.attendance.reduce((a,x)=>a+(+x.count||0),0);v.innerHTML=`<div class="grid"><div class="card"><div class="muted">Projects</div><div class="stat">${db.projects.length}</div></div><div class="card"><div class="muted">Total Expenses</div><div class="stat">${money(ex)}</div></div><div class="card"><div class="muted">Payments Received</div><div class="stat">${money(rec)}</div></div><div class="card"><div class="muted">MB Entries</div><div class="stat">${db.mb.length}</div></div><div class="card"><div class="muted">DPR Entries</div><div class="stat">${db.dpr.length}</div></div><div class="card"><div class="muted">Labour Attendance (head-days)</div><div class="stat">${lab}</div></div></div><div class="card"><div class="sectionhead"><h3>Project Overview</h3><span class="pill">Offline</span></div>${db.projects.map(p=>`<div class="item"><b>${esc(p.name)}</b> <span class="pill">${esc(p.status)}</span><div class="muted">${esc(p.client)} · Contract ${money(p.amount)} · Expenses ${money(sum(db.expenses.filter(x=>x.project===p.id)))}</div><div class="actions"><button class="btn light small" onclick="summary('${p.id}')">Project details</button></div></div>`).join('')||'<div class="empty">No projects available.</div>'}</div><div class="note">Records are stored on this device. Export a JSON backup regularly and keep a copy outside the phone.</div>`}
function projects(v){v.innerHTML=`<div class="card"><h3>Add New Project</h3><form onsubmit="addProject(event)"><div class="row"><div><label>Project Name *</label><input name="name" required></div><div><label>Department / Client</label><input name="client"></div><div><label>Location</label><input name="location"></div><div><label>Contract Amount (₹)</label><input name="amount" type="number" step=".01"></div><div><label>Start Date</label><input name="date" type="date"></div><div><label>Status</label><select name="status"><option>Planning</option><option>Active</option><option>On Hold</option><option>Completed</option></select></div></div><label>Scope / Notes</label><textarea name="notes"></textarea><button class="btn gold">Save Project</button></form></div><div class="card"><h3>Saved Projects</h3>${db.projects.map(p=>`<div class="item"><b>${esc(p.name)}</b> <span class="pill">${esc(p.status)}</span><div class="muted">${esc(p.client)} · ${esc(p.location)} · ${money(p.amount)}</div>${p.tenderId?`<div class="muted">Contract ${esc(p.contractNo)} · Tender ${esc(p.tenderId)} · Work ID ${esc(p.workId)} · ${p.lengthM}m × ${p.widthM}m</div>`:''}<button class="btn light small" onclick="summary('${p.id}')">View details</button></div>`).join('')}</div>`}
function addProject(e){e.preventDefault();let f=new FormData(e.target);db.projects.push({id:id(),name:f.get('name'),client:f.get('client'),location:f.get('location'),amount:+f.get('amount')||0,date:f.get('date'),status:f.get('status'),notes:f.get('notes')});save();render()}
function summary(pid){let p=db.projects.find(x=>x.id===pid);alert(`${p.name}\nDepartment: ${p.client||'-'}\nContract: ${p.contractNo||'-'}\nTender: ${p.tenderId||'-'}\nWork ID: ${p.workId||'-'}\nRoad: ${p.lengthM||'-'}m × ${p.widthM||'-'}m = ${p.areaSqm||'-'} sqm\nBOQ Estimate: ${money(p.estimatedAmount)}\nAccepted value: ${money(p.amount)}\nStatus: ${p.status}\nBOQ:\n${(p.boq||[]).map(b=>`${b.item}: ${b.qty} ${b.unit} – ${money(b.amount)}`).join('\n')}`)}
function formCard(title,fields,handler){return `<div class="card"><h3>${title}</h3><form onsubmit="${handler}(event)"><div class="row">${fields}</div><button class="btn gold">Save Record</button></form></div>`}function field(label,name,type='text',extra=''){return `<div><label>${label}</label><input name="${name}" type="${type}" ${extra}></div>`}function projectField(){return `<div><label>Project *</label><select name="project" required>${opts()}</select></div>`}function dateField(){return field('Date','date','date',`value="${today()}" required`)}function recList(title,arr,fmt){return `<div class="card"><h3>${title}</h3>${arr.length?arr.slice().reverse().map(x=>`<div class="item">${fmt(x)}<button class="btn danger small" style="float:right" onclick="del('${title}','${x.id}')">Delete</button></div>`).join(''):'<div class="empty">No records yet.</div>'}</div>`}
function del(title,i){let map={'Measurement Book':'mb','Daily Progress':'dpr','Labour Attendance':'attendance','Material Consumption':'consumption','Materials':'materials','Expenses':'expenses','Payments':'payments','Machinery':'machines'};let k=map[title];if(k&&confirm('Delete this record?')){db[k]=db[k].filter(x=>x.id!==i);save();render()}}
function measurement(v){v.innerHTML=formCard('Measurement Book (MB)',projectField()+dateField()+field('MB No.','mbno')+field('Road / Chainage From','from')+field('Chainage To','to')+field('Length (m)','length','number','step=".01"')+field('Width (m)','width','number','step=".01"')+field('Thickness / Depth (m)','thickness','number','step=".001"')+field('Quantity','qty','number','step=".001"')+`<div><label>Unit</label><select name="unit"><option>sqm</option><option>cum</option><option>m</option><option>MT</option><option>Nos</option></select></div>`+field('Item / BOQ Description','item')+field('Measured By','measuredBy')+field('Checked By','checkedBy')+`<div style="grid-column:1/-1"><label>Remarks</label><textarea name="remarks"></textarea></div>`,'saveMB')+recList('Measurement Entries',db.mb,x=>`<b>${esc(x.item||'Measurement')}</b> · ${esc(pname(x.project))}<div class="muted">${esc(x.date)} · MB ${esc(x.mbno)} · Chainage ${esc(x.from)}–${esc(x.to)} · ${x.qty} ${esc(x.unit)} · ${esc(x.remarks)}</div>`)}
function saveMB(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id();['length','width','thickness','qty'].forEach(k=>o[k]=+o[k]||0);db.mb.push(o);save();render()}
function progress(v){v.innerHTML=formCard('Daily Progress Report (DPR)',projectField()+dateField()+field('Weather','weather')+field('Work Activity','activity')+field('Chainage / Location','chainage')+field('Target Quantity','target','number','step=".01"')+field('Achieved Quantity','achieved','number','step=".01"')+field('Unit','unit')+field('Site In-charge','incharge')+`<div style="grid-column:1/-1"><label>Issues / Safety / Remarks</label><textarea name="remarks"></textarea></div>`,'saveDPR')+recList('Daily Progress Logs',db.dpr,x=>`<b>${esc(x.activity)}</b> · ${esc(pname(x.project))}<div class="muted">${esc(x.date)} · ${esc(x.chainage)} · Target ${x.target||0}, achieved ${x.achieved||0} ${esc(x.unit)} · ${esc(x.weather)}</div><div class="muted">${esc(x.remarks)}</div>`)}function saveDPR(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id();o.target=+o.target||0;o.achieved=+o.achieved||0;db.dpr.push(o);save();render()}
function attendance(v){v.innerHTML=formCard('Labour Attendance',projectField()+dateField()+field('Labour Category','category')+field('Contractor / Mate','mate')+field('Workers Present','count','number','min="0" required')+field('Half-day Workers','half','number','min="0"')+field('Rate per Person (₹)','rate','number','step=".01"')+field('Total Wage (₹)','wage','number','step=".01"')+`<div><label>Shift</label><select name="shift"><option>Full Day</option><option>Half Day</option><option>Night</option></select></div><div style="grid-column:1/-1"><label>Remarks</label><textarea name="remarks"></textarea></div>`,'saveAttendance')+recList('Attendance Register',db.attendance,x=>`<b>${esc(x.category)}</b> · ${esc(pname(x.project))}<div class="muted">${esc(x.date)} · Present ${x.count} · Half day ${x.half||0} · Wage ${money(x.wage)} · Mate ${esc(x.mate)}</div>`)}function saveAttendance(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id();['count','half','rate','wage'].forEach(k=>o[k]=+o[k]||0);db.attendance.push(o);save();render()}
function materials(v){v.innerHTML=formCard('Material Purchase / Stock In',projectField()+dateField()+field('Material Name','name')+field('Quantity','qty','number','step=".001" min="0.001"')+`<div><label>Unit</label><select name="unit"><option>MT</option><option>Cu.M</option><option>Bag</option><option>Litre</option><option>Trip</option><option>Piece</option></select></div>`+field('Total Cost (₹)','cost','number','step=".01"')+field('Low Stock Alert Level','minimum','number','step=".001" min="0"')+field('Supplier','supplier')+field('Invoice / Challan No.','invoice'),'saveMaterial')+recList('Material Receipts',db.materials,x=>`<b>${esc(x.name)}</b> · ${esc(pname(x.project))}<div class="muted">${esc(x.date)} · ${x.qty} ${esc(x.unit)} · ${money(x.cost)} · ${esc(x.supplier)} · ${esc(x.invoice)}</div>`)}function saveMaterial(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id();o.qty=+o.qty||0;o.cost=+o.cost||0;o.minimum=+o.minimum||0;db.materials.push(o);save();render()}
function consumption(v){v.innerHTML=formCard('Material Consumption / Stock Out',projectField()+dateField()+field('Material Name','name')+field('Quantity Used','qty','number','step=".001" min="0.001"')+field('Unit','unit')+field('Work Activity / Chainage','activity')+field('Issued To / Site In-charge','issuedTo')+field('Challan No.','challan')+`<div style="grid-column:1/-1"><label>Remarks</label><textarea name="remarks"></textarea></div>`,'saveConsumption')+`<div class="card"><h3>Material Balance (purchase minus recorded consumption)</h3>${stockRows()}</div>`+recList('Consumption Register',db.consumption,x=>`<b>${esc(x.name)}</b> · ${esc(pname(x.project))}<div class="muted">${esc(x.date)} · Used ${x.qty} ${esc(x.unit)} · ${esc(x.activity)} · Issued to ${esc(x.issuedTo)}</div>`)}function saveConsumption(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id();o.qty=+o.qty||0;db.consumption.push(o);save();render()}function stockRows(){let keys=[...new Set([...db.materials.map(x=>x.name+'|'+x.project+'|'+x.unit),...db.consumption.map(x=>x.name+'|'+x.project+'|'+x.unit)])];return keys.length?keys.map(k=>{let[n,p,u]=k.split('|'),inQ=db.materials.filter(x=>x.name===n&&x.project===p&&x.unit===u).reduce((a,x)=>a+x.qty,0),out=db.consumption.filter(x=>x.name===n&&x.project===p&&x.unit===u).reduce((a,x)=>a+x.qty,0);let bal=inQ-out,min=Math.max(0,...db.materials.filter(x=>x.name===n&&x.project===p&&x.unit===u).map(x=>+x.minimum||0));return `<div class="item"><b>${esc(n)}</b> · ${esc(pname(p))}<div class="muted">In ${inQ} · Used ${out} · Balance <b>${bal} ${esc(u)}</b> · Alert level ${min} ${bal<=min?'<span class="pill" style="background:#ffe3e3;color:#a22">LOW STOCK</span>':'<span class="pill">OK</span>'}</div></div>`}).join(''):'<div class="empty">No stock records.</div>'}
function expenses(v){v.innerHTML=formCard('Record Site Expense',projectField()+dateField()+`<div><label>Category</label><select name="category"><option>Labour</option><option>Diesel / Fuel</option><option>Machinery</option><option>Transport</option><option>Material</option><option>Food / Site</option><option>Testing / Quality</option><option>Other</option></select></div>`+field('Amount (₹)','amount','number','min="0.01" step=".01" required')+field('Paid To / Vendor','party')+field('Bill / Voucher No.','voucher')+`<div style="grid-column:1/-1"><label>Description</label><textarea name="description"></textarea></div>`,'saveExpense')+recList('Expense Register',db.expenses,x=>`<b>${esc(x.category)}</b> · ${esc(pname(x.project))} · ${money(x.amount)}<div class="muted">${esc(x.date)} · ${esc(x.party)} · ${esc(x.voucher)} · ${esc(x.description)}</div>`)}function saveExpense(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id();o.amount=+o.amount||0;db.expenses.push(o);save();render()}
function payments(v){v.innerHTML=formCard('Payment / Running Bill Tracking',projectField()+dateField()+`<div><label>Type</label><select name="type"><option>Received</option><option>Pending</option><option>Advance Paid</option><option>Running Bill Submitted</option><option>Security Deposit</option></select></div>`+field('Amount (₹)','amount','number','min="0.01" step=".01" required')+field('Bill / RA Bill No.','billno')+field('Reference / Party','party')+`<div style="grid-column:1/-1"><label>Notes</label><textarea name="notes"></textarea></div>`,'savePayment')+recList('Payment Register',db.payments,x=>`<b>${esc(x.type)}</b> · ${esc(pname(x.project))} · ${money(x.amount)}<div class="muted">${esc(x.date)} · ${esc(x.billno)} · ${esc(x.party)}</div>`)}function savePayment(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id();o.amount=+o.amount||0;db.payments.push(o);save();render()}
function machinery(v){v.innerHTML=formCard('Machinery & Equipment Log',projectField()+dateField()+field('Machine','name')+field('Opening Meter','opening','number','step=".1"')+field('Closing Meter','closing','number','step=".1"')+field('Hours Used','hours','number','step=".1"')+field('Fuel Used (L)','fuel','number','step=".1"')+field('Cost (₹)','cost','number','step=".01"')+field('Operator','operator')+`<div style="grid-column:1/-1"><label>Maintenance / Notes</label><textarea name="notes"></textarea></div>`,'saveMachine')+recList('Machine Logs',db.machines,x=>`<b>${esc(x.name)}</b> · ${esc(pname(x.project))}<div class="muted">${esc(x.date)} · ${x.hours||0} hrs · Fuel ${x.fuel||0} L · ${money(x.cost)} · ${esc(x.operator)}</div>`)}function saveMachine(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id();['opening','closing','hours','fuel','cost'].forEach(k=>o[k]=+o[k]||0);db.machines.push(o);save();render()}
function sum(a){return a.reduce((s,x)=>s+(+x.amount||0),0)}function reports(v){v.innerHTML=`<div class="card"><h3>Project Financial & Work Summary</h3><div class="tablewrap"><table><tr><th>Project</th><th>Contract</th><th>Expense</th><th>Est. Margin</th><th>Received</th><th>Pending</th><th>MB</th><th>DPR</th><th>Labour</th></tr>${db.projects.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.amount)}</td><td>${money(sum(db.expenses.filter(x=>x.project===p.id)))}</td><td>${money((+p.amount||0)-sum(db.expenses.filter(x=>x.project===p.id)))}</td><td>${money(sum(db.payments.filter(x=>x.project===p.id&&x.type==='Received')))}</td><td>${money(Math.max(0,(+p.amount||0)-sum(db.payments.filter(x=>x.project===p.id&&x.type==='Received'))))}</td><td>${db.mb.filter(x=>x.project===p.id).length}</td><td>${db.dpr.filter(x=>x.project===p.id).length}</td><td>${db.attendance.filter(x=>x.project===p.id).reduce((a,x)=>a+(+x.count||0),0)}</td></tr>`).join('')}</table></div><div class="actions"><button class="btn gold" onclick="window.print()">Print / Save PDF</button><button class="btn light" onclick="exportCSV()">Export CSV</button></div><p class="muted">This is a management summary, not a certified PWD measurement or statutory account. Verify all quantities and bills before submission.</p></div><div class="card"><h3>Records Overview</h3>MB ${db.mb.length} · DPR ${db.dpr.length} · Attendance ${db.attendance.length} · Material receipts ${db.materials.length} · Consumption ${db.consumption.length} · Expenses ${db.expenses.length} · Payments ${db.payments.length}</div>`}
function backup(v){v.innerHTML=`<div class="card"><h3>Backup & Restore</h3><p>All records remain on this device in offline mode. Export JSON frequently, and keep copies in another location.</p><div class="actions"><button class="btn gold" onclick="exportJSON()">Download Full JSON Backup</button><label class="btn light" style="display:inline-block">Restore JSON<input type="file" accept="application/json,.json" hidden onchange="restoreJSON(event)"></label><button class="btn light" onclick="exportCSV()">Export All Records CSV</button></div><hr><p class="muted">Projects ${db.projects.length} · MB ${db.mb.length} · DPR ${db.dpr.length} · Attendance ${db.attendance.length} · Materials ${db.materials.length} · Consumption ${db.consumption.length} · Expenses ${db.expenses.length} · Payments ${db.payments.length} · Machinery ${db.machines.length}</p><button class="btn danger" onclick="resetAll()">Delete All Data</button></div><div class="note">Important: Restore replaces current records. Export a backup first. Do not clear app/browser storage or uninstall before backing up. Keep original signed MB and official site records separately.</div>`}
function download(n,c,t){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([c],{type:t}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}function exportJSON(){download('Atharv_Enterprises_Backup_'+today()+'.json',JSON.stringify({app:'Atharv Enterprises',version:2,exportedAt:new Date().toISOString(),data:db},null,2),'application/json')}
function restoreJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!Array.isArray(d.projects))throw Error('Invalid backup file');if(confirm('Replace all current records with this backup?')){db={...blank(),...d};save();render();alert('Backup restored.')}}catch(err){alert('Restore failed: '+err.message)}};r.readAsText(f)}
function exportCSV(){let rows=[['Type','Date','Project','Details','Quantity','Unit','Amount','Remarks']];let add=(type,a,details,q='',unit='',amt='',remarks='')=>rows.push([type,a.date,pname(a.project),details,q,unit,amt,remarks]);db.mb.forEach(x=>add('MB',x,`${x.item} ${x.from}-${x.to}`,x.qty,x.unit,'',x.remarks));db.dpr.forEach(x=>add('DPR',x,x.activity,x.achieved,x.unit,'',x.remarks));db.attendance.forEach(x=>add('Attendance',x,x.category,x.count,'persons',x.wage,x.remarks));db.materials.forEach(x=>add('Material In',x,x.name,x.qty,x.unit,x.cost,x.supplier));db.consumption.forEach(x=>add('Consumption',x,x.name,x.qty,x.unit,'',x.activity));db.expenses.forEach(x=>add('Expense',x,x.category,'','',x.amount,x.description));db.payments.forEach(x=>add('Payment',x,x.type,'','',x.amount,x.billno));db.machines.forEach(x=>add('Machinery',x,x.name,x.hours,'hours',x.cost,x.notes));let csv=rows.map(r=>r.map(z=>'"'+String(z??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('Atharv_Enterprises_All_Records.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
function resetAll(){if(confirm('Permanently delete all app data? Export a backup first.')){db=blank();save();render()}}

function siteEvidence(v){v.innerHTML=`<div class="card"><h3>Site Visit Evidence · GPS Timestamp & Photos</h3><form onsubmit="saveEvidence(event)">${projectField()}${dateField()}<div><label>Work Stage</label><select name="stage"><option>Before Work</option><option>During Work</option><option>After Work</option><option>Inspection</option></select></div>${field('Chainage / Site Point','chainage')}<div><label>GPS Coordinates</label><input id="gpscoords" name="gps" placeholder="Tap Get GPS Location" readonly><button type="button" class="btn light" onclick="getGPS()">📍 Get GPS Location</button></div><div><label>Site Photo(s)</label><input name="photos" type="file" accept="image/*" capture="environment" multiple></div><div><label>Site Notes</label><textarea name="notes"></textarea></div><div style="grid-column:1/-1"><label>Digital Signature (draw below)</label><canvas id="sigpad" width="700" height="180" style="width:100%;height:150px;border:1px solid #aaa;border-radius:8px;touch-action:none;background:#fff"></canvas><button type="button" class="btn light small" onclick="clearSig()">Clear Signature</button></div><button class="btn gold">Save Site Evidence</button></form><p class="muted">GPS requires location permission and may need internet/GPS signal. Timestamp is recorded from this device clock.</p></div>${recList('Saved Site Evidence',db.evidence,x=>`<b>${esc(x.stage)}</b> · ${esc(pname(x.project))}<div class="muted">${esc(x.date)} ${esc(x.time)} · ${esc(x.chainage)} · ${esc(x.gps)} · ${x.photos?.length||0} photo(s) · ${x.signature?'Signature saved':''}</div><div>${(x.photos||[]).map(a=>`<img src="${a}" style="width:90px;height:70px;object-fit:cover;border-radius:6px;margin:4px">`).join('')}</div><div>${esc(x.notes)}</div>`)}`;setTimeout(initSig,50)}
let sigDrawing=false;function initSig(){let c=document.getElementById('sigpad');if(!c)return;let ctx=c.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';function pos(e){let r=c.getBoundingClientRect(),t=e.touches?.[0]||e;return{x:(t.clientX-r.left)*c.width/r.width,y:(t.clientY-r.top)*c.height/r.height}}function start(e){sigDrawing=true;let q=pos(e);ctx.beginPath();ctx.moveTo(q.x,q.y);e.preventDefault()}function move(e){if(!sigDrawing)return;let q=pos(e);ctx.lineTo(q.x,q.y);ctx.stroke();e.preventDefault()}function end(){sigDrawing=false}c.onpointerdown=start;c.onpointermove=move;c.onpointerup=end;c.onpointerleave=end}function clearSig(){let c=document.getElementById('sigpad');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}function getGPS(){let el=document.getElementById('gpscoords');if(!navigator.geolocation){alert('GPS is not supported on this device/browser.');return}el.value='Getting location…';navigator.geolocation.getCurrentPosition(p=>el.value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6)+' (±'+Math.round(p.coords.accuracy)+'m)',e=>{el.value='';alert('Location unavailable: '+e.message)}, {enableHighAccuracy:true,timeout:20000,maximumAge:0})}
async function saveEvidence(e){e.preventDefault();let f=e.target,fd=new FormData(f),files=[...(f.elements.photos.files||[])];let photos=await Promise.all(files.map(file=>new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)})));let c=document.getElementById('sigpad'),sig=c.toDataURL('image/png');let o=Object.fromEntries(fd);o.id=id();o.photos=photos;o.signature=sig;o.time=new Date().toLocaleTimeString();o.savedAt=new Date().toISOString();db.evidence.push(o);save();render()}
function paymentCalculator(v){v.innerHTML=`<div class="card"><h3>Contractor / RA Bill Payment Calculator</h3><div class="row">${field('Gross Bill Amount (₹)','gross','number','id="pgross" min="0" step=".01" oninput="calcPay()"')}${field('GST % (if applicable)','gst','number','id="pgst" value="0" step=".01" oninput="calcPay()"')}${field('TDS %','tds','number','id="ptds" value="0" step=".01" oninput="calcPay()"')}${field('Security Deposit / Retention %','sd','number','id="psd" value="0" step=".01" oninput="calcPay()"')}${field('Other Deductions (₹)','other','number','id="pother" value="0" step=".01" oninput="calcPay()"')}${field('Advance Recovery (₹)','advance','number','id="padv" value="0" step=".01" oninput="calcPay()"')}</div><div class="card" style="background:#fff8e8"><div id="payresult">Enter bill amount to calculate.</div></div><p class="muted">Calculator is indicative only. Apply GST/TDS and contractual deductions exactly as per applicable rules, agreement and department bill statement.</p></div>`}
function calcPay(){let g=+document.getElementById('pgross')?.value||0,t=+document.getElementById('ptds')?.value||0,s=+document.getElementById('psd')?.value||0,o=+document.getElementById('pother')?.value||0,a=+document.getElementById('padv')?.value||0,gst=+document.getElementById('pgst')?.value||0,gstAmt=g*gst/100,tds=g*t/100,sd=g*s/100,net=g+gstAmt-tds-sd-o-a;document.getElementById('payresult').innerHTML=`<b>Bill Amount:</b> ${money(g)}<br>GST: ${money(gstAmt)}<br>TDS Deduction: ${money(tds)}<br>Security / Retention: ${money(sd)}<br>Other Deductions: ${money(o)}<br>Advance Recovery: ${money(a)}<hr><b>Estimated Net Payable: ${money(net)}</b>`}
function documentVault(v){v.innerHTML=`<div class="card"><h3>Project Document Vault</h3><form onsubmit="saveDocument(event)">${projectField()}<div><label>Document Type</label><select name="type"><option>Work Order</option><option>Agreement</option><option>NIT / Tender</option><option>Technical Sanction</option><option>Estimate / BOQ</option><option>MB</option><option>RA Bill</option><option>Test Report</option><option>Other</option></select></div>${field('Document Name / Reference','name')}<div><label>PDF / Image / File</label><input name="file" type="file" required accept=".pdf,image/*,.doc,.docx,.xls,.xlsx"></div><button class="btn gold">Save Document</button></form><p class="muted">Files are stored locally in this browser/app. Large files may use significant phone storage; keep backups.</p></div>${recList('Stored Documents',db.documents,x=>`<b>${esc(x.type)}: ${esc(x.name)}</b> · ${esc(pname(x.project))}<div class="muted">${esc(x.fileName)} · ${esc(x.date)}</div><button class="btn light small" onclick="openDoc('${x.id}')">Open / Download</button>`)}`}
async function saveDocument(e){e.preventDefault();let f=e.target,fd=new FormData(f),file=f.elements.file.files[0];if(!file)return;let data=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)});let o=Object.fromEntries(fd);o.id=id();o.fileName=file.name;o.mime=file.type;o.data=data;o.date=today();db.documents.push(o);save();render()}function openDoc(i){let x=db.documents.find(d=>d.id===i);if(!x)return;let a=document.createElement('a');a.href=x.data;a.download=x.fileName;a.target='_blank';a.click()}

render();
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script></body></html>
